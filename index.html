<link href="https://fonts.googleapis.com" rel="stylesheet">
<style>
    body { 
        margin: 0; 
        font-family: 'Kanit', sans-serif; 
        background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
        color: #fff; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        overflow: hidden;
    }

    .container { 
        position: relative;
        padding: 45px 25px; 
        max-width: 400px; 
        width: 85%; 
        background: rgba(15, 15, 15, 0.85); 
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 20px; 
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 25px 50px rgba(0,0,0,1); 
        z-index: 10;
        text-align: center;
    }

    h1 { 
        font-size: 32px; 
        font-weight: 700;
        margin-bottom: 5px; 
        text-transform: uppercase;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #ffffff, #666, #ffffff);
        background-size: 200% auto;
        -webkit-background-clip: text; 
        -webkit-text-fill-color: transparent; 
        animation: shine 4s linear infinite;
    }

    @keyframes shine { to { background-position: 200% center; } }
    .subtitle { color: rgba(255,255,255,0.7); font-weight: 300; font-size: 15px; margin-bottom: 30px; }

    .button { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        margin: 15px 0; 
        padding: 16px; 
        border-radius: 8px; 
        text-decoration: none; 
        font-weight: 500; 
        transition: 0.3s all; 
        gap: 12px; 
        cursor: pointer; 
        border: none; 
        width: 100%; 
        font-size: 15px; 
        color: #fff; 
        box-sizing: border-box;
        text-transform: uppercase;
    }

    .donate { background: #ffffff; color: #000; font-weight: 700; }
    .bank { background: transparent; border: 1px solid rgba(255,255,255,0.2); }
    
    .social-grid { 
        display: grid; 
        grid-template-columns: repeat(4, 1fr); 
        gap: 8px; 
        margin-top: 20px; 
    }
    
    .social { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 12px; }
    .button:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); border-color: rgba(255,255,255,0.5); }

    .bank-info { 
        display: none; 
        background: rgba(255, 255, 255, 0.05); 
        padding: 20px; 
        border-radius: 8px; 
        margin-bottom: 10px; 
        border: 1px solid rgba(255, 255, 255, 0.1); 
        animation: fadeIn 0.4s ease; 
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .copy-status { font-size: 11px; color: #00ffcc; display: none; margin-top: 8px; }
    .footer { margin-top: 40px; color: rgba(255,255,255,0.2); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
    svg { width: 20px; height: 20px; fill: #fff; }
</style>
</head>

<script>
    // ส่วนที่ 1: จัดการเพลง YouTube
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('music-player', {
            height: '0', width: '0',
            videoId: 'mYVfV3p7X18', // ใส่ ID เพลง YouTube ตรงนี้ (ตัวอย่าง: เพลงแนว Chill)
            events: { 'onReady': onPlayerReady }
        });
    }
    function onPlayerReady(event) { event.target.setVolume(40); }

    // เริ่มเพลงเมื่อกดตรงไหนก็ได้บนหน้าจอครั้งแรก
    document.body.addEventListener('click', function() {
        if (player && player.playVideo) { player.playVideo(); }
    }, { once: true });

    // ส่วนที่ 2: ระบบคัดลอก (อัปเกรด)
    function toggleBank() {
        var x = document.getElementById("bankDetails");
        x.style.display = (x.style.display === "block") ? "none" : "block";
    }

    function copyAccount() {
        var accNo = "2057436362";
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(accNo).then(showSuccess);
        } else {
            // สำรองสำหรับมือถือบางรุ่น/Line/FB
            var textArea = document.createElement("textarea");
            textArea.value = accNo;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); showSuccess(); } 
            catch (err) { alert('กรุณาคัดลอกเลขบัญชีด้วยตนเอง'); }
            document.body.removeChild(textArea);
        }
    }

    function showSuccess() {
        var msg = document.getElementById("copyMsg");
        msg.style.display = "block";
        setTimeout(function() { msg.style.display = "none"; }, 2500);
    }
</script>
